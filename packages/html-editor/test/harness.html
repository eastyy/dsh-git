<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>HTML editor harness</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #e9ecf2; color: #101828; font: 13px/1.5 "Segoe UI", "PingFang SC", sans-serif; }
  header { height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: #fff; border-bottom: 1px solid rgba(15,23,42,.1); }
  header b { font-size: 13px; }
  header .path { color: #64748b; font-size: 11.5px; }
  header .grow { flex: 1; }
  button { height: 28px; padding: 0 10px; border: 1px solid rgba(15,23,42,.16); border-radius: 7px; background: #fff; color: inherit; font: inherit; font-size: 12px; cursor: pointer; }
  button.primary { background: #2f6bff; border-color: transparent; color: #fff; font-weight: 600; }
  main { display: flex; gap: 14px; padding: 14px; }
  .stage { flex: 1; background: #dfe3ea; border-radius: 10px; padding: 14px; }
  iframe { display: block; width: 100%; height: 780px; border: 0; border-radius: 8px; background: #fff; box-shadow: 0 10px 30px rgba(15,23,42,.14); }
  aside { width: 280px; background: #fff; border: 1px solid rgba(15,23,42,.1); border-radius: 10px; padding: 12px; font-size: 12px; }
  aside h3 { margin: 0 0 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #64748b; }
  .sel { min-height: 84px; padding: 10px; border-radius: 8px; background: #f5f7fb; color: #475467; white-space: pre-wrap; font-family: ui-monospace, Consolas, monospace; font-size: 11px; }
  .log { margin-top: 12px; max-height: 520px; overflow: auto; padding-left: 16px; color: #667085; font-size: 11px; }
  .log li { margin: 2px 0; }
  .status { color: #15803d; }
</style>
</head>
<body>
<header>
  <b>HTML 编辑</b><span class="path" id="path">__PATH__</span><span class="grow"></span>
  <span class="status" id="status">载入中…</span>
  <button onclick="send('command',{name:'undo'})">撤销</button>
  <button onclick="send('command',{name:'redo'})">重做</button>
  <button onclick="send('command',{name:'delete'})">删除</button>
  <button class="primary" id="save" onclick="saveNow()">保存</button>
</header>
<main>
  <div class="stage"><iframe id="frame" src="__SRC__" sandbox="allow-scripts allow-same-origin"></iframe></div>
  <aside>
    <h3>选中元素</h3>
    <div class="sel" id="sel">未选中</div>
    <h3 style="margin-top:14px">消息</h3>
    <ul class="log" id="log"></ul>
  </aside>
</main>
<script>
  const ROOT = '__ROOT__'
  const PATH = '__PATH__'
  const frame = document.getElementById('frame')
  const log = document.getElementById('log')
  const sel = document.getElementById('sel')
  const status = document.getElementById('status')
  window.__log = []
  window.__saved = null

  function send(type, payload) {
    frame.contentWindow.postMessage({ type: 'dhe:' + type, payload: payload || {} }, '*')
  }
  window.send = send
  window.applyColor = function (value) { send('style', { changes: { color: value } }) }

  window.addEventListener('message', function (event) {
    if (event.source !== frame.contentWindow) return
    const data = event.data
    if (!data || !data.type) return
    window.__log.push(data)
    const li = document.createElement('li')
    li.textContent = data.type + (data.selection ? ' · ' + data.selection.label : '')
    log.appendChild(li)
    if (data.type === 'dhe:ready') status.textContent = '已就绪'
    if (data.type === 'dhe:state') status.textContent = data.dirty ? '未保存' : '已保存'
    if (data.type === 'dhe:selection') {
      sel.textContent = data.selection
        ? data.selection.tag + (data.selection.id ? '#' + data.selection.id : '') +
          '\n' + data.selection.rect.width + ' × ' + data.selection.rect.height +
          '\ntext-editable: ' + data.selection.textEditable
        : '未选中'
    }
    if (data.type === 'dhe:serialize') {
      fetch('/__dsh-html-editor/api/save', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ root: ROOT, path: PATH, html: data.html }),
      })
        .then((response) => response.json())
        .then((json) => {
          window.__saved = json
          send('saved', { requestId: data.requestId, ok: json.ok === true, error: json.error || '' })
          status.textContent = json.ok ? '已保存' : '保存失败'
        })
        .catch((error) => {
          window.__saved = { ok: false, error: String(error) }
          send('saved', { requestId: data.requestId, ok: false, error: String(error) })
        })
    }
  })

  function saveNow() { send('save', {}) }
  window.saveNow = saveNow
</script>
</body>
</html>
